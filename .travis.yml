language: go
go:
  - 1.26.x
env:
  - BOT_TOKEN=1234:334
before_install:
  - sudo apt-get install libc6 libc6-dev -y
  - go install github.com/mitchellh/gox@latest
script:
  - go test -v -race -covermode=atomic -coverprofile=coverage.out ./...
after_success:
  - $(go env GOPATH)/bin/gox -osarch="linux/amd64 linux/386" -cgo -ldflags "-X github.com/ssalvatori/zbot-telegram/zbot.version=`git describe --tags` -X github.com/ssalvatori/zbot-telegram/zbot.buildTime=`TZ=UTC date -u '+%Y-%m-%dT%H:%M:%SZ'` -X github.com/ssalvatori/zbot-telegram/zbot.gitHash=`git rev-parse --short HEAD`" -output "dist/{{.Dir}}-{{.OS}}-{{.Arch}}"
deploy:
  provider: releases
  cleanup: false
  file_glob: true
  file: dist/*
  api_key: "$GITHUB_API_SECURED"
  on:
    tags: true
